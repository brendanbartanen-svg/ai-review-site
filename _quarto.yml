project:
  type: website
  output-dir: _site
  # Render only the site pages. README.md, LICENSE, build/ and prompts/ are not pages.
  render:
    - index.qmd
    - methods.qmd
    - comparison.qmd
    - mistakes.qmd
    - overreach.qmd
    - corrections.qmd
    - "papers/*/*.qmd"
  # Raw prompt files, linked from the Methods page, and the quote-free data
  # files written by build/export_data.py, linked from the audit pages.
  resources:
    - "prompts/*.md"
    - "data/*.csv"

website:
  title: "Reader's Guides: AI reviews of 33 education research papers"
  site-url: https://brendanbartanen-svg.github.io/ai-review-site/
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Papers
      - href: methods.qmd
        text: Methods
      - text: Audits
        menu:
          - href: mistakes.qmd
            text: Mistakes audit
          - href: overreach.qmd
            text: Overreach census
      - href: comparison.qmd
        text: Comparison
      - href: corrections.qmd
        text: Corrections
  page-footer:
    center: "These reviews were generated by AI systems and checked in part, not in full. They are a complement to reading the paper, not a substitute for it. Known errors are listed on the [Corrections page](/corrections.qmd). Licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3

execute:
  enabled: false

# Discussion threads (giscus) are configured in papers/_metadata.yml, which
# build/build_site.py writes, so that only paper pages get a thread.
