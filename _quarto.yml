project:
  type: website
  output-dir: _site
  # Render only the site pages. README.md, LICENSE, build/ and prompts/ are not pages.
  render:
    - index.qmd
    - methods.qmd
    - comparison.qmd
    - mistakes.qmd
    - overreach.qmd
    - corrections.qmd
    - "papers/*/*.qmd"
  # Raw prompt files, linked from the Methods page, and the quote-free data
  # files written by build/export_data.py, linked from the audit pages.
  resources:
    - "prompts/*.md"
    - "data/*.csv"

website:
  title: "Reader's Guides: AI reviews of 33 education research papers"
  # site-url: https://OWNER.github.io/REPO/   # set once the repository exists
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Papers
      - href: methods.qmd
        text: Methods
      - text: Audits
        menu:
          - href: mistakes.qmd
            text: Mistakes audit
          - href: overreach.qmd
            text: Overreach census
      - href: comparison.qmd
        text: Comparison
      - href: corrections.qmd
        text: Corrections
  page-footer:
    center: "These reviews were generated by AI systems and checked in part, not in full. They are a complement to reading the paper, not a substitute for it. Known errors are listed on the [Corrections page](/corrections.qmd). Licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3

execute:
  enabled: false

# Discussion threads (Giscus). Needs the GitHub repository to be public, with
# Discussions enabled and the giscus app installed; take repo-id and
# category-id from https://giscus.app. Uncomment to add a thread to every page.
# To limit threads to the paper pages, put this block in papers/_metadata.yml
# instead (note: build_site.py deletes and regenerates papers/, so it would
# need to write that file too).
# comments:
#   giscus:
#     repo: OWNER/REPO
#     repo-id: "R_xxxxxxxxxx"
#     category: "Announcements"
#     category-id: "DIC_xxxxxxxxxx"
#     mapping: pathname
#     reactions-enabled: true
#     input-position: top
