# Per-paper notes: shown in the callout at the top of the paper page and listed
# on the Corrections page.
notes:

  - pid: P15
    note: >-
      The PDF reviewed was typeset 2026-07-17, before the corrigendum published
      2026-08-07 (doi 10.3102/01623737261473601). The corrigendum adds an author
      acknowledgment and changes no results.

  - pid: P22
    note: >-
      As of 2026-09-25, Crossref lists no correction or corrigendum for this
      article. The review's central finding about Figure 3 should be re-checked
      against the journal's current version before being relied on.

  - pid: P22
    note: >-
      The online supplement, obtained 2026-09-25, contains the numbers behind
      the intended figure: Supplemental Table A4, Panel A, reports district
      per-pupil revenue by HOLC grade for 1989–90, 1999–00, 2009–10 and
      2017–18, cell for cell identical to Table 4 of the authors' 2021 working
      paper (Annenberg EdWorkingPaper 21-363). Neither the article nor the
      supplement contains a correctly rendered version of Figure 3; the working
      paper's Figure 4 is the only dollar-scale rendering of these series in
      the public record. On the supplement's numbers, the A–D gap in local
      revenue grows from $3,592 to $5,874 over the period, the state-aid offset
      grows from −$1,575 to −$3,854, federal revenue roughly doubles for every
      grade in 2009–10 and falls back by 2017–18, and the A–D gap in total
      revenue falls from $1,688 (p<.01) to $1,291 (not significant).
      Separately, the trend figures quoted in the article's text for school
      racial composition (a Black-share gap shrinking from 13.4 to 10.3 points,
      a White-share gap of about 35 points, diversity gaps beyond 0.08) appear
      verbatim in the working paper's text and do not match Supplemental
      Table A4, Panel B, where the A–D Black-share gap is 0.09 to 0.10 in every
      year, the White-share gap 0.26 to 0.29, and the largest diversity gap
      0.06. Supplemental Table A7 shows the school-level achievement and
      composition gradients holding with controls for family income, building
      age and percent Black.

  # 2026-09-26: notes from the reconciliation audit (deposits, supplements and
  # earlier versions that bear on how a review should be read).

  - pid: P03
    note: >-
      The openICPSR deposit (10.3886/E249905V1, read 2026-09-26) confirms what
      both reviews infer from the article: no pooled model exists.
      RaceNativityLabor_MainResults.do estimates Tables 3–4 in a loop over race
      groups, and no script contains a race × linkage term or any cross-group
      test (no suest, test, lincom, nlcom or margins). Approximate z-tests from
      the reported standard errors put the Black–White and Hispanic–White
      differences in Linkage × Match at z = 2.3 and 2.9 for earnings, so the
      abstract's "benefit more" claim survives for earnings among Black and
      Hispanic workers and not for unemployment. The same deposit shows
      Appendix Table A1 follows the stated ratio rule (see the correction on
      the Claude review).

  - pid: P06
    note: >-
      The ICPSR deposit (study 308283, read 2026-09-26) settles what Table 2
      is. Its README states that tract-level income and immigrant density were
      joined to campuses "for the descriptive table analysis" and that county
      ACS processing served the choropleth maps only, so Table 2's bins are
      census tracts mislabeled as counties; relabelling them reconciles every
      sum, and the note (69 of 74 TWDL hot spots in El Paso County) and
      Figure 3 are right. The TEA program file is not deposited, so the table
      cannot be recounted. Separately, the abstract's conclusions were carried
      nearly verbatim from the author's 2023 Texas A&M dissertation, which ran
      the hot-spot analysis on raw enrollment (hot spots in San Antonio, Austin
      and El Paso); the article re-ran it on enrollment ratios, which moved
      the TWDL hot spots to El Paso County, and kept the conclusions.

  - pid: P07
    note: >-
      The openICPSR deposit (248577, read 2026-09-26) settles the 38% Pell
      share that appears only in prose: line 664 of HPP_Analysis.Rmd computes it
      as the mean of IPEDS percent Pell over the pooled 2015–2019 analytic
      sample (1,462 institution-years). The same file shows the criterion-3
      model is trained on 2015–2018 and predicts 2019, so the prediction is out
      of sample.

  - pid: P11
    note: >-
      The online supplement, read 2026-09-26, bears on the Discussion's
      "turnover of nearly half the workforce (which we found in one state and
      in some locations in other states)." Charter-school total turnover in the
      supplement reaches 46–56% (Indiana 55.6%, Washington 55.7%, Texas 51.6%,
      Massachusetts 46.3%), which supports the "some locations" clause. The
      "one state" clause traces only to a single-year Texas figure (2022–23,
      47.4%) in the OSF and working-paper over-time table, which appears in
      neither the article nor the supplement and which the posted code
      suggests double-counts switchers. The reviews' statement that the
      article's highest statewide figure is 35.9% is correct.

  - pid: P23
    note: >-
      The external record, read 2026-09-26, contains cost data the article does
      not: the program's endline report has a cost-effectiveness annex
      (pp. 131–132) giving about $90 per student, about $9,000 per school
      (about $6,000 marginal) and about $290 per standard deviation of
      knowledge gain, which the authors compare with $95.60 per SD for Kenyan
      textbooks. The reviews' statements that the article reports no cost data
      are correct; the "scalable model" claim can be read against these
      figures.

  - pid: P29
    note: >-
      The UAS 567 methodology documentation, read 2026-09-26, explains the half
      sample in Models 9–13 of Table 3 (N = 1,727–1,827 against 3,892): the
