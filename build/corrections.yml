  # Britton P05-1 / P05-2
  - pid: P05
    reader: claude
    date: "2026-09-26"
    file_scope: both
    anchor: "The paper's signature subgroup finding is contradicted by its own table."
    extra_anchors:
      - anchor: "Do not cite this in either direction until an erratum settles which of the text or the table is correct"
        file_scope: both
      - anchor: "do not cite the Black-student finding in either direction until an erratum resolves the sign"
        file_scope: both
      - anchor: "Either the table or the paper's central finding is wrong, and a reader cannot tell which."
        file_scope: review
    pointers:
      - anchor: "The entire Black-student narrative in the Discussion is unusable until this sign is resolved by the authors or an erratum."
        file_scope: review
        text: "*See the correction note under Key Concerns: the article's own appendix settles the sign.*"
      - anchor: "Until resolved, the paper's signature finding cannot be relied upon in either direction."
        file_scope: review
        text: "*See the correction note under Key Concerns: the article's own appendix settles the sign.*"
    note: >-
      The article itself settles which side is wrong: the table, not the
      prose. Table 12b (p. 17) reports the reverse regression of average GPA in
      grades 9–11 on Black-teacher share at −0.0041***, −0.0007*** and
      −0.0007***, negative in every column; Figure B1 (p. 26), drawn by the
      estimation software, plots the Table 4 (p. 10) column 2 coefficient at
      about −0.002 where the table prints +0.0020; and Table A4 (p. 25) prints
      −0.0903*** where Table 8 (p. 12) column 6 prints −0.0195. Two independent
      identities plus a demonstrated dropped sign elsewhere show that Table 6's
      Black-student columns lost their minus signs in typesetting, so the
      negative GPA relationship for Black students described in the abstract,
      results and discussion is the correct reading and the printed +5.13 is
      wrong. The attendance sub-claim is different: with covariates the
      Black-student estimate in Table 5 is 0.0046 (SE 0.0040), not significant
      under either sign, so "negative and significant" is unsupported whatever
      the sign. Found during the September 2026 reconciliation audit; confirmed
      against the rendered pages and replicated by an independent blind reader.
    where: "Synthesis, Overall Assessment, Key Concerns and What to Treat Cautiously; same text in the full Claude review, plus the Methods, Writing and Contribution sub-reviews"
    what_was_wrong: "Said Table 6 contradicts the text and that which side is right cannot be settled without an erratum."
    correction: "Table 12b, Figure B1 and Table A4 show Table 6 dropped its minus signs; the prose is right for the GPA claim. The attendance claim fails regardless of sign (0.0046, SE 0.0040)."

